# Render Free configuration for ONYX Tattoo Studio.
# The Free web service has an ephemeral filesystem: SQLite data and uploads
# can be lost on redeploy, restart, or idle spin-down. Do not use this
# configuration for durable production customer data without external storage.
services:
  - type: web
    name: onyx-tattoo-studio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATA_DIR
        value: .data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Studio Owner

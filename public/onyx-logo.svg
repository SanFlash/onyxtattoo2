<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
<title id="title">ONYX Tattoo Studio</title><desc id="desc">Luxury black, gold and silver ONYX Tattoo Studio emblem with geometric mountain and tattoo needle.</desc>
